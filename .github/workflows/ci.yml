name: CI

on:
  push:
    branches: ["main", "foundation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev,mcp]"
      - name: Lint
        run: ruff check .
      - name: Unit and API tests
        run: pytest -q --cov=scalper --cov-report=term-missing
      - name: Bandit
        run: bandit -q -r scalper
      - name: Dependency audit
        run: pip-audit
