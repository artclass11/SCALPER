[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.44,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "scalper-workbench"
version = "0.1.0"
description = "Privacy-first algorithmic trading workbench with safe strategy DSL and paper-only broker adapter"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "ARTCLASS" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "cryptography>=44,<47"
]

[project.optional-dependencies]
mcp = ["mcp>=1.28,<2"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "bandit>=1.8,<2",
  "pip-audit>=2.8,<3"
]
desktop = ["pyinstaller>=6.10,<7"]

[project.scripts]
scalper = "scalper.cli:main"
scalper-worker = "scalper.worker:main"
scalper-mcp = "scalper.mcp_server:main"

[tool.setuptools.packages.find]
include = ["scalper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["F", "UP", "B"]

[tool.bandit]
exclude_dirs = ["tests"]
